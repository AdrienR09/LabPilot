# LabPilot native instrument window layout — which UI component "blocks"
# make up each instrument type's window, and their type-level acquisition
# defaults (poll rate, dock titles, ...). This is tier 2 of a two-tier
# parameter system: tier 3 (an individual instrument's own config params,
# e.g. a specific spectrometer's integration_time_ms) is generated at
# runtime from that instrument's DeviceSchema instead, by the
# "settings_tree" block below — never stored here.
#
# Copied from the packaged default (src/ui/desktop/config/ui_blocks.toml)
# to this file on first run. Edit freely: add/remove/reorder blocks, tweak
# defaults — instrument_window.py re-reads this file every time a native
# window is opened, no code change or restart needed.
#
# Each block is `{ type = "<component_type>", ...params }` — `type` must
# name a component registered in the "instrument" context (every
# UIComponent subclass in src/ui/desktop/components/ registers itself; see
# components/base.py, and scripts/verify_ui_registry.py, which checks every
# type below resolves). Everything else is passed through as that
# component's params, merged over its own default_params (this file's
# values win).
#
# Two params every block understands, whatever its type:
#
#   area     = "left" | "right" | "top" | "bottom"
#              Where this block's dock goes. Omit to keep the component's
#              own default, which is what every block below does.
#   tab_with = "<dock title>"
#              Tab this block's dock behind an already-placed one instead
#              of giving it its own space — how to fit two large views in
#              the room for one. Names a dock title from an *earlier* block
#              in the same list, e.g.
#
#                { type = "viewer", dimensionality = "1D", dock_title = "Spectrum" },
#                { type = "time_series", dock_title = "Trend", tab_with = "Spectrum" },
#
# Where a dock ends up after you drag it is remembered separately, per
# instrument kind and dimensionality (QSettings; see instrument_window.py's
# _restore_layout). This file is the starting layout, not the last one.
#
# "move_control" (components/move_controls.py) is deliberately the
# simplest control surface: current value, a set-value spinbox with an
# Absolute/Relative choice, and Move To + Home — no slider mode, no
# continuous-scan section. Basic control over the instrument is the whole
# point of this window; a workflow's own scan behavior belongs to that
# workflow's own UI (see workflow_window.py), not duplicated here.
# A discrete-valued axis (bool, or a small-range integer like a 2-4
# position switch/filter wheel — inferred from the connected instrument's
# own DeviceSchema dtype/limits, nothing to configure here) always renders
# as a switch instead of a numeric control, regardless of dimensionality.

[detector."0D"]
blocks = [
  { type = "toolbar", title = "Trace Controls", actions = [
      { name = "start", label = "Start trace", checkable = true, icon_off = "start-counter", icon_on = "stop-counter", tooltip = "Start/Stop continuous reading of the data trace." },
      { name = "record", label = "Record", checkable = true, icon_off = "record-counter", icon_on = "stop-record-counter", tooltip = "Start/Stop accumulating trace data." },
      { name = "snapshot", label = "Snapshot", icon = "trace-snapshot", tooltip = "Take a single measurement now." },
  ] },
  { type = "time_series", dock_title = "Trend", trace_window_s = 30.0 },
  { type = "poll_rate", default_ms = 200 },
  { type = "settings_tree" },
]

[detector."1D"]
blocks = [
  { type = "toolbar", title = "Acquisition Controls", actions = [
      { name = "start", label = "Start acquisition", checkable = true, icon_off = "start-counter", icon_on = "stop-counter", tooltip = "Start/Stop continuous spectrum acquisition." },
      { name = "snapshot", label = "Acquire", icon = "trace-snapshot", tooltip = "Acquire a single spectrum now." },
  ] },
  { type = "viewer", dimensionality = "1D", dock_title = "Spectrum", spectrometer_controls = true },
  { type = "poll_rate", default_ms = 200 },
  { type = "settings_tree" },
]

[detector."2D"]
blocks = [
  { type = "toolbar", title = "Scan Controls", actions = [
      { name = "start", label = "Start scan", checkable = true, icon_off = "scan-xy-start", icon_on = "stop-scan", tooltip = "Start/Stop continuous scan image acquisition." },
      { name = "snapshot", label = "Snapshot", icon = "trace-snapshot", tooltip = "Acquire a single scan image now." },
  ] },
  { type = "viewer", dimensionality = "2D", dock_title = "Scan image" },
  { type = "poll_rate", default_ms = 200 },
  { type = "settings_tree" },
]

[detector."ND"]
blocks = [
  { type = "toolbar", title = "Scan Controls", actions = [
      { name = "start", label = "Start scan", checkable = true, icon_off = "scan-xy-start", icon_on = "stop-scan", tooltip = "Start/Stop continuous scan acquisition." },
      { name = "snapshot", label = "Snapshot", icon = "trace-snapshot", tooltip = "Acquire a single scan now." },
  ] },
  { type = "hyperspectral_viewer" },
  { type = "poll_rate", default_ms = 500 },
  { type = "settings_tree" },
]

[actuator."0D"]
blocks = [
  { type = "move_control" },
]

[actuator."1D"]
blocks = [
  { type = "move_control" },
]

[actuator."ND"]
blocks = [
  { type = "move_control" },
]

[source."SOURCE"]
blocks = [
  { type = "move_control" },
  { type = "poll_rate", default_ms = 200 },
  { type = "settings_tree" },
  { type = "actions" },
]

# A "generic"-kind instrument that isn't 0D/1D/2D/ND resolves here
# (config_kind() collapses "generic" -> "detector",
# config_dimensionality() passes its raw "GENERIC" dimensionality through
# unchanged — see instrument_blocks.py). A device whose interesting
# contract is a capability gets a `[capability.<name>]` section below
# instead, which wins over this bucket.
[detector."GENERIC"]
blocks = [
  { type = "toolbar", title = "Instrument", actions = [
      { name = "snapshot", label = "Refresh status", icon = "trace-snapshot", tooltip = "Read current status." },
  ] },
  { type = "actions" },
  { type = "settings_tree" },
]

# --- Capability sections --------------------------------------------------
#
# These win over (kind, dimensionality): a pulser and a hardware-timed
# scanner are both kind="generic", which says only that neither is a motor
# or a detector, so selecting on that alone put every one of them in the
# same bucket. A capability says what the device actually implements.
#
# There is deliberately no sequence editor here. Authoring a sequence needs
# no hardware and belongs to the free-standing editor *workflow* (see
# workflow_templates/pulse_sequence_editor.py); an instrument window shows
# what this particular pulser is doing, which is a different question.

[capability.pulser]
blocks = [
  { type = "toolbar", title = "Pulser", actions = [
      { name = "snapshot", label = "Refresh status", icon = "trace-snapshot", tooltip = "Read what is loaded and whether it is playing." },
  ] },
  { type = "actions" },
  { type = "settings_tree" },
]

[capability.gated_counter]
blocks = [
  { type = "toolbar", title = "Counter", actions = [
      { name = "snapshot", label = "Refresh status", icon = "trace-snapshot", tooltip = "Read sweeps, gates and bins." },
  ] },
  { type = "actions" },
  { type = "settings_tree" },
]
