{
  "name": "nv_confocal",
  "description": "NV confocal + ODMR + pulsed: coarse/fine stages, a photon counter, a microwave source, a spectrometer, a camera and an NI card.",
  "todo": [
    "mw.host \u2014 the IP address the Siglent's LAN screen shows",
    "daq.model \u2014 the NI card's model, e.g. PXIe-6363 (`python scripts/ni_probe.py` prints it)",
    "daq.channels \u2014 which terminal each signal is on, e.g. 'x=ao0, y=ao1, apd=ctr0/pfi8'",
    "fpga.bitfile \u2014 left blank on purpose: a pulsed run picks the image its sequence needs",
    "spectrometer.model \u2014 blank asks the device; naming it makes the limits right before it is plugged in"
  ],
  "devices": [
    {
      "id": "stage_fine",
      "name": "Fine stage",
      "adapter_type": "mcl_nano_drive",
      "connection_params": {},
      "custom_settings": {},
      "is_enabled": true
    },
    {
      "id": "stage_coarse",
      "name": "Coarse stage",
      "adapter_type": "mcl_micro_drive",
      "connection_params": {
        "axes": "x,y,z",
        "travel_mm": 25.4
      },
      "custom_settings": {},
      "is_enabled": true
    },
    {
      "id": "counter",
      "name": "PicoHarp counter",
      "adapter_type": "picoharp_300",
      "connection_params": {
        "device_index": 0
      },
      "custom_settings": {},
      "is_enabled": true
    },
    {
      "id": "mw",
      "name": "Microwave source",
      "adapter_type": "siglent_ssg",
      "connection_params": {
        "host": "TODO-ip-address"
      },
      "custom_settings": {},
      "is_enabled": true
    },
    {
      "id": "spectrometer",
      "name": "Spectrometer",
      "adapter_type": "ocean_optics",
      "connection_params": {
        "serial_number": "",
        "model": ""
      },
      "custom_settings": {},
      "is_enabled": true
    },
    {
      "id": "camera",
      "name": "Hamamatsu camera",
      "adapter_type": "hamamatsu_dcam",
      "connection_params": {
        "camera_index": 0
      },
      "custom_settings": {},
      "is_enabled": true
    },
    {
      "id": "daq",
      "name": "NI DAQ card",
      "adapter_type": "ni_card",
      "connection_params": {
        "device": "Dev1",
        "model": "TODO-card-model"
      },
      "custom_settings": {},
      "is_enabled": true
    },
    {
      "id": "fpga",
      "name": "NI R-Series FPGA",
      "adapter_type": "ni_rseries_fpga",
      "connection_params": {
        "resource": "RIO0",
        "bitfile": ""
      },
      "custom_settings": {},
      "is_enabled": true
    }
  ]
}
