# --- The escape hatch -------------------------------------------------------
# For a card this table does not list. Nothing is stated, so nothing is
# validated: every terminal is taken on trust and the wiring is checked by
# NI-DAQmx itself when the card is opened. Use it to get running, then run
# `python scripts/ni_probe.py` on the machine with the card in it and paste
# the block it prints into ~/.labpilot/config/ni_models.toml — after which
# the terminals are checked properly again.

[[card]]
number = "generic"
label = "Unlisted NI card"
notes = "No inventory stated, so no terminal is validated offline."
