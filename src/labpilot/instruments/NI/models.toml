# NI DAQ card models — ports and limits, for configuring a card offline.
#
# Read `models.py` first: this table is NOT authoritative. When a card is
# actually opened, NI-DAQmx is asked and the device wins; this exists so
# that a rig can be wired up, validated and saved with no card present,
# which is the one thing qudi, pylablib, pyMoDAQ and Micro-Manager all
# leave you to do by reading a datasheet.
#
# Editing it
# ----------
# Override or add models in ~/.labpilot/config/ni_models.toml, which is
# merged over this file entry by entry — a `[[card]]` there with a
# `number` that appears here overrides just the fields it names.
# `python scripts/ni_probe.py` prints the block for a card that is
# plugged in, which is the reliable way to add one.
#
# Omission means "not stated"
# ---------------------------
# Every field is optional and an absent one is never validated. That is
# deliberate: a missing `pfi` count means a PFI terminal is taken on
# trust, whereas a guessed one would reject a perfectly good wiring. Port
# *counts* are the exception — they generate the terminal names, so they
# are stated for every model here.
#
# Fields
#   number          model number, without the bus prefix ("6363")
#   family          key into [family.*] below, for the shared defaults
#   buses           bus prefixes NI ships it on; informational only —
#                   matching is on the number, so an unlisted bus is
#                   never a reason to reject a card
#   ai / ao         channel counts (single-ended AI; differential is ai/2
#                   on a multiplexed card)
#   ai_rate         aggregate S/s for the card, or per channel when
#                   ai_simultaneous is true
#   ao_rate         S/s; ABSENT means software-timed only, which is what
#                   makes a card unable to drive a hardware-timed scan
#   dio             total digital lines; dio_ports overrides the layout
#   pfi             PFI lines, PFI0..pfi-1
#   counters        general-purpose counter/timers, ctr0..counters-1
#   timebase        maximum internal counter timebase, Hz


# --- Family defaults --------------------------------------------------------
# Series-wide facts, stated once. An entry's own field always wins.

[family.X]
counters = 4
counter_bits = 32
timebase = 100.0e6
pfi = 16
ai_bits = 16
ai_ranges = [0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]
ao_range = 10.0

[family.Xs]  # simultaneous-sampling X Series: one ADC per channel
counters = 4
counter_bits = 32
timebase = 100.0e6
pfi = 16
ai_bits = 16
ai_simultaneous = true
ai_ranges = [1.0, 2.0, 5.0, 10.0]
ao_range = 10.0

[family.M]
counters = 2
counter_bits = 32
timebase = 80.0e6
pfi = 16
ai_bits = 16
ai_ranges = [0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]
ao_range = 10.0

[family.S]  # simultaneous-sampling S Series
counters = 2
counter_bits = 24
timebase = 20.0e6
pfi = 10
ai_simultaneous = true
ao_range = 10.0

[family.USB]  # low-cost bus-powered USB
counters = 1
counter_bits = 32
ao_range = 10.0

[family.CTR]  # counter/timer and digital I/O only
counter_bits = 32


# --- X Series (63xx) --------------------------------------------------------
# The current multifunction line, and the one most quantum-optics rigs are
# built on: four 32-bit counters and a 100 MHz timebase are what make a
# card usable for photon counting as well as scanning.

