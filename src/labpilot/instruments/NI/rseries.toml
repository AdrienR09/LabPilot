# The escape hatch, exactly as in models.toml: an entry that states no
# I/O at all. Nothing is checked against it offline, and the bitfile —
# which is the authority on an R-Series card anyway — is taken at its
# word. Use it for a FlexRIO target, a cRIO chassis, or any board this
# table does not list.
[[card]]
number = "generic"
label = "generic (unlisted card)"


# ========================== [[bitfile]] =============================
#
# The compiled images you have, and what each one's engine can play.
#
# **This ships empty, and that is not an omission.** A bitfile is built
# from a LabVIEW FPGA project with the Xilinx toolchain; it takes tens of
# minutes, it is specific to one FPGA part, and nobody can ship one for
# your rig. What ships is the shape of an entry and the register names
# the reference VI uses.
#
# Filling this in is what lets a *measurement* choose the image: the
# pulsed measurement knows its sequence needs five channels and a
# counter, and this table says which of your images offers that. Leave it
# empty and pin one image with the adapter's `bitfile` setting instead —
# both paths are supported and neither is the fallback for the other.
#
# An entry looks like this:
#
#     [[bitfile]]
#     name = "pulser8_100MHz"
#     path = "~/fpga/pulser_8ch_100MHz_7852R.lvbitx"
#     model = "7852"                 # the card it was compiled for
#     tick_rate = 100e6              # the engine's clock, in Hz
#     channels = ["DIO0", "DIO1", "DIO2", "DIO3",
#                 "DIO4", "DIO5", "DIO6", "DIO7"]
#     memory = 8192                  # instructions it holds; 0 = unstated
#     counter = true                 # it has the counting half too
#
#     # Only if your VI does not use the reference names. Anything you
#     # leave out keeps its default — see bitfiles.py's `Gateware`.
#     [bitfile.gateware]
#     instructions = "Pulse FIFO"
#     run = "Start"
#
# `channels` is in **bit order**: position in that list is the bit this
# adapter sets in the instruction word's channel mask, so it has to match
# the order your VI unpacks them in. That is the one thing here that
# silently produces a working sequence on the wrong wires.
