# NI R-Series (FPGA) cards, and the compiled bitfiles you have for them.
#
# Two tables in one file, because they are the two things you configure
# `ni_rseries_fpga` with and they refer to each other: a bitfile is
# compiled for exactly one card.
#
# Copy to ~/.labpilot/config/ni_rseries.toml to add or correct entries.
# Yours is an *override layer*, not a replacement: an entry you do not
# mention survives untouched, and one you invent is kept. Nothing is ever
# written back to your file.
#
#
# =========================== [[card]] ===============================
#
# What the card physically has. Deliberately thin, and much less
# load-bearing than instruments/NI/models.toml is for a DAQmx card:
# on an R-Series board the *bitfile* decides which lines are driven, at
# what derived clock, and how deep the program memory is. This is only
# the envelope around that.
#
# The repo's rule applies as it does everywhere: **a field nobody was
# sure of is left out, and an absent field is never validated.** The
# entries below carry the numbers from NI's published specifications that
# are consistent across their datasheets — analog counts, the 40 MHz
# onboard clock, the FPGA part. Per-model DIO counts vary by connector
# configuration and are given only where the family is unambiguous.
#
# Opening a card checks the model against what the driver reports and
# says so in the instrument's `warning` if they disagree — the device is
# right by definition.

[family.R5]
# The Virtex-5 generation: 8 AI, 8 AO, a 40 MHz onboard clock.
base_clock = 40e6
ai = 8
ao = 8

[family.R7]
# The Kintex-7 generation. Same analog complement, same base clock, much
# more fabric — which in practice means a deeper instruction memory and a
# higher derived tick rate for the same design.
base_clock = 40e6
ai = 8
ao = 8

[[card]]
number = "7841"
family = "R5"
label = "NI 7841R"
buses = ["PCIe", "PXI"]
fpga = "Virtex-5 LX30"
dio = 96

