# Ocean Optics / Ocean Insight spectrometers — detector and exposure limits.
#
# Transcribed from python-seabreeze's own per-model classes
# (`seabreeze/pyseabreeze/devices.py`, MIT), which carries these because
# the USB protocol differs per model and the library has no choice but to
# know. `pixels`, `max_counts`, the integration limits and the dark-pixel
# ranges are that file's `spectrum_num_pixel`, `spectrum_max_value`,
# `integration_time_min`/`_max` (microseconds) and `dark_pixel_indices`.
#
# `model` is the name a connected device reports through seabreeze;
# `label` is what it is called on the box, and `aliases` are the other
# spellings people type. Lookup ignores case, spaces and hyphens.
#
# Editing it: override or add entries in
# ~/.labpilot/config/ocean_models.toml, which is merged over this file
# entry by entry. The connected device always wins over both — see
# models.py.

# --- Current line -----------------------------------------------------------

