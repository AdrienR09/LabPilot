[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labpilot"
version = "0.1.0"
description = "Next-generation Python data acquisition framework for laboratory instruments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "LabPilot Development Team" }
]
keywords = ["data-acquisition", "DAQ", "laboratory", "instruments", "async", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Framework :: AsyncIO",
]

# Everything `import labpilot` and `labpilot start` need, and nothing
# else. A driver library belongs in an extra below: an NI card is not a
# reason for a lab with a spectrometer to install NI-DAQmx.
dependencies = [
    "anyio >= 4.0.0",
    "pydantic >= 2.0.0",
    "numpy >= 1.24.0",
    # Fits — ODMR dips, Rabi decay, T1 — and therefore the optimizer and
    # half the shipped templates. Imported lazily inside each fit function,
    # which is *not* a guard: it raises ModuleNotFoundError at the point of
    # use rather than at import, so leaving it undeclared meant a fresh
    # install fitted nothing and only said so mid-run.
    "scipy >= 1.10",
    "h5py >= 3.8.0",
    "aiosqlite >= 0.19.0",
    "fastapi >= 0.104.0",
    "uvicorn[standard] >= 0.24.0",
    "httpx >= 0.25.0",
]

[project.optional-dependencies]
# --- Instrument driver libraries -------------------------------------------
#
# Every adapter imports its driver *inside* the method that needs it, so an
# uninstalled extra costs a clear error when you connect that instrument and
# nothing at all otherwise. `labpilot list-adapters` lists all of them
# either way, because an adapter describes itself without its driver.

pymeasure = [
    "pymeasure >= 0.14",
]
pylablib = [
    "pylablib >= 1.4",
]
# National Instruments DAQ cards (instruments/NI/). No macOS build exists —
# NI ships DAQmx for Windows and Linux only — which is why the model table
# in instruments/NI/models.toml is worth having at all.
ni = [
    "nidaqmx >= 0.9 ; sys_platform != 'darwin'",
    "pylablib >= 1.4",
]
# NI R-Series FPGA cards (instruments/NI/fpga.py). `nifpga` is NI's own
# host interface; it needs the NI-RIO driver installed as well, which is
# Windows and Linux only. The bitfile itself is compiled from a LabVIEW
# FPGA project and cannot be shipped by anyone — see instruments/NI/
# rseries.toml.
ni-fpga = [
    "nifpga >= 22.0 ; sys_platform != 'darwin'",
]
# Ocean Optics / Ocean Insight spectrometers (instruments/OceanOptics/).
oceanoptics = [
    "seabreeze >= 2.0",
]
# Swabian Instruments: the Time Tagger counter and the Pulse Streamer
# sequencer. TimeTagger itself is not on PyPI — install it from Swabian's
# own installer — so only the pulser is declared here.
swabian = [
    "pulsestreamer >= 2.1",
]
# SpinCore PulseBlaster (instruments/SpinCore/). `spinapi` wraps a vendor
# shared library that its wheel does not bundle, so the vendor driver has
# to be installed as well.
spincore = [
    "spinapi >= 3.2",
]

# Qt visualization layer
gui = [
    "PyQt6 >= 6.5.0",
    # A separate distribution from PyQt6, and nothing else in this tree
    # depends on it — so it was missing from every fresh install while
    # appearing to work here, where it happened to be in the conda env.
    # `ui/desktop/manager_qt_webview.py` imports QtWebEngineWidgets at
    # module level: without this, `labpilot-manager` cannot start at all.
    "PyQt6-WebEngine >= 6.5.0",
    "pyqtgraph >= 0.13",
    "PyOpenGL >= 3.1",
    "vispy >= 0.14",
    # Scientific viewer widgets (Viewer0D/1D/2D) embedded in the native
    # instrument windows — see src/labpilot/ui/desktop/instrument_windows.py.
    "pymodaq_gui >= 5.1",
]

# Native IPython console window (see ui/desktop/console_window.py) — a
# real out-of-process kernel shown in a Qt widget (qtconsole), not a
# browser/iframe notebook.
console = [
    "qtconsole >= 5.5",
    "ipykernel >= 6.25",
]

# --- Grouped ---------------------------------------------------------------

# A working desktop install: the window system and the native console.
# There is no `cli` extra — `labpilot start` and `labpilot list-adapters`
# are argparse, which is stdlib, so the CLI is in the base install.
app = [
    "labpilot[gui,console]",
]
# Everything that installs cleanly from PyPI on any platform. Hardware
# extras are deliberately excluded — see each of them above for why.
full = [
    "labpilot[gui,console,pymeasure,pylablib]",
]
dev = [
    "pytest >= 7.4.0",
    "pytest-asyncio >= 0.21.0",
    "ruff >= 0.1.0",
    "mypy >= 1.6.0",
    "build >= 1.0",
]

[project.urls]
Homepage = "https://github.com/labpilot/labpilot"
Documentation = "https://labpilot.readthedocs.io"
Repository = "https://github.com/labpilot/labpilot"
Issues = "https://github.com/labpilot/labpilot/issues"

[project.scripts]
labpilot = "labpilot.core.cli:main"

[project.gui-scripts]
# The manager window. A gui-script rather than a console one so Windows
# launches it without a console window behind it.
labpilot-manager = "labpilot.ui.desktop.manager_qt_webview:main"

[tool.hatch.build.targets.wheel]
packages = ["src/labpilot"]

# Adds the built React bundle at labpilot/frontend_build/ when one exists.
# A hook rather than `force-include`, which hard-errors on a missing path
# and would break every fresh clone — see hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# An sdist is a complete checkout of what builds the project — including
# `frontend/build`, even though it is a build artifact and is gitignored.
# `python -m build` builds the sdist first and then the wheel FROM it, so
# leaving the bundle out means the standard build command silently produces
# a wheel with no browser UI. Shipping built front-end assets in the sdist
# is what lets someone build a working wheel without installing Node, and is
# what other Python packages wrapping a JS front end do for the same reason.
include = ["src", "tests", "scripts", "docs", "frontend", "README.md", "LICENSE", "ATTRIBUTION.md", "pyproject.toml", "hatch_build.py"]
# node_modules only: tens of thousands of files, and reproducible from
# package.json. The build output is kept, via `artifacts` below.
exclude = ["frontend/node_modules", "**/__pycache__", "**/.DS_Store"]
# `include` is not enough on its own: hatchling selects sdist files through
# the VCS, so anything in .gitignore is dropped regardless — and the bundle
# is gitignored, being a build artifact. `artifacts` is the override meant
# for precisely this case.
artifacts = ["frontend/build/**"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in argument defaults (used by Pydantic)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # allow unused imports in __init__.py
# Qt signals are class-scope attributes and are mixedCase by Qt's own
# convention — `sigParamChanged`, not `sig_param_changed`. Renaming them
# would make this codebase the only Qt code that spells them differently,
# so N815 is off where the Qt widgets live rather than silenced one
# `# noqa` at a time.
"src/labpilot/ui/desktop/**" = ["N815"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # A pre-existing leak: something in the FastAPI lifespan exercised by
    # TestClient leaves an event loop unclosed, and Python reports it from the
    # garbage collector. As an *unraisable* warning it surfaces at whatever
    # test happens to be running when GC fires, so with "error" it failed a
    # different, unrelated test depending on collection order — a misleading
    # signal rather than a useful one. Tracked as real work; downgraded here so
    # CI reports the tests it actually ran.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "hardware: tests that require physical hardware",
    "visa: tests that require VISA instruments",
    "ni: tests that require NI hardware",
    "serial: tests that require serial devices",
    "epics: tests that require EPICS",
    "server: tests that require HTTP server",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/labpilot"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/cli.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "^\\s*@",
]
